name: Android CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests and compile debug/release
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: CI notice
        run: |
          echo "CI only validates the project."
          echo "Installable APKs are produced by Android Signed Release."
