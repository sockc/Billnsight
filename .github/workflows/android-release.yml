name: Android Signed Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billinsight-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Restore permanent signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          mkdir -p release-signing

          printf '%s' "$SIGNING_KEY_BASE64"             | tr -d '\r\n '             | base64 --decode             > release-signing/billinsight-release.jks

          test -s release-signing/billinsight-release.jks

          keytool -list             -keystore release-signing/billinsight-release.jks             -storepass "$SIGNING_STORE_PASSWORD"             -alias "$SIGNING_KEY_ALIAS"             >/dev/null

          cat > signing.properties <<EOF2
          storeFile=release-signing/billinsight-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF2

      - name: Test and build signed release
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"

          test -x "$APKSIGNER"
          test -s "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt

          grep -Eq '^Verified using v2 scheme \(APK Signature Scheme v2\): true$' signature.txt
          grep -Eq '^Number of signers: 1$' signature.txt

          EXPECTED="26888f203233db5eb96cd942fbd584fce8dc1f6bf75d7890af4fbf739d8450a4"
          ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' signature.txt             | head -n1             | tr '[:upper:]' '[:lower:]'             | tr -d ':[:space:]')"

          echo "Expected certificate SHA-256: $EXPECTED"
          echo "Actual certificate SHA-256:   $ACTUAL"

          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare signed APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          APK_NAME="BillInsight-v${VERSION_NAME}.apk"

          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          sha256sum "release/$APK_NAME" | tee "release/$APK_NAME.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillInsight-v${{ env.VERSION_NAME }}-signed
          path: |
            release/${{ env.APK_NAME }}
            release/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Check GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "PUBLISH_RELEASE=false" >> "$GITHUB_ENV"
            echo "GitHub Release $RELEASE_TAG already exists; signed APK artifact was still built."
          else
            echo "PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Create version tag
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already exists at $TAG_SHA, but current commit is $GITHUB_SHA."
              echo "Bump versionName/versionCode before publishing another official release."
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG"             "release/$APK_NAME"             "release/$APK_NAME.sha256"             --title "BillInsight $RELEASE_TAG"             --generate-notes             --target "$GITHUB_SHA"
