name: Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore permanent signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          mkdir -p release-signing

          printf '%s' "$SIGNING_KEY_BASE64"             | tr -d '\r\n '             | base64 --decode             > release-signing/billinsight-release.jks

          test -s release-signing/billinsight-release.jks

          keytool -list             -keystore release-signing/billinsight-release.jks             -storepass "$SIGNING_STORE_PASSWORD"             -alias "$SIGNING_KEY_ALIAS"             >/dev/null

          cat > signing.properties <<EOF2
          storeFile=release-signing/billinsight-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF2

      - name: Test and build signed release
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"

          test -x "$APKSIGNER"
          test -s "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt

          grep -Eq '^Verified using v2 scheme \(APK Signature Scheme v2\): true
      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK_NAME="BillInsight-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="BillInsight-signed-${GITHUB_RUN_NUMBER}.apk"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BillInsight-signed-release
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APK="release/$APK_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK"               --title "BillInsight $TAG"               --generate-notes
          fi
 signature.txt
          grep -Eq '^Number of signers: 1
      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK_NAME="BillInsight-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="BillInsight-signed-${GITHUB_RUN_NUMBER}.apk"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BillInsight-signed-release
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APK="release/$APK_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK"               --title "BillInsight $TAG"               --generate-notes
          fi
 signature.txt

          EXPECTED="26888f203233db5eb96cd942fbd584fce8dc1f6bf75d7890af4fbf739d8450a4"
          ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' signature.txt \
            | head -n1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]')"

          echo "Expected certificate SHA-256: $EXPECTED"
          echo "Actual certificate SHA-256:   $ACTUAL"

          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK_NAME="BillInsight-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="BillInsight-signed-${GITHUB_RUN_NUMBER}.apk"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BillInsight-signed-release
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APK="release/$APK_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK"               --title "BillInsight $TAG"               --generate-notes
          fi
